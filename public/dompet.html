<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dompet — RatuBlast</title>
<link rel="icon" href="/uploads/logo.png"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body data-auth="1">
<div class="container">
<div class="topbar"><div class="brand"><img src="/uploads/logo.png" onerror="this.style.display='none'"/> Dompet</div></div>
<div class="card">
<div style="color:var(--muted);font-size:11px;letter-spacing:1.4px;">SALDO UTAMA</div>
<div style="font-size:38px;font-weight:800;color:var(--green);margin:10px 0;" data-saldo>Rp 0</div>
<div style="color:var(--muted);font-size:12px;">Minimal WD: Rp 10.000</div>
</div>
<div class="card">
<h3>Form Penarikan</h3>
<div class="sub">Pilih jumlah atau isi manual</div>
<div style="display:flex;gap:8px;margin-bottom:12px;">
<button class="btn ghost preset" data-v="10000" style="flex:1;padding:10px;">Rp 10.000</button>
<button class="btn ghost preset" data-v="20000" style="flex:1;padding:10px;">Rp 20.000</button>
<button class="btn ghost preset" data-v="30000" style="flex:1;padding:10px;">Rp 30.000</button>
</div>
<label>Atau tulis jumlahnya</label>
<input class="input" id="amount" type="number" placeholder="Contoh: 50000" min="10000"/>
<label>Metode</label>
<select id="method">
<option value="DANA">DANA</option>
<option value="OVO">OVO</option>
<option value="GOPAY">GoPay</option>
<option value="BANK">Bank</option>
</select>
<label>Nomor / Rekening</label>
<input class="input" id="account" placeholder="08xxxxxxxxxx"/>
<label>Nama Pemilik</label>
<input class="input" id="holder" placeholder="Nama sesuai akun"/>
<button class="btn green" id="wdBtn">↓ AJUKAN PENARIKAN</button>
</div>
<div class="card">
<h3>Riwayat WD</h3>
<div id="wdList" style="font-size:13px;">Memuat…</div>
</div>
</div>
<nav class="nav-bottom">
<a href="/dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
<a href="/perangkat"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg><span>Perangkat</span></a>
<a href="/dompet" class="active"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v2"/><path d="M3 7v10a2 2 0 002 2h14a1 1 0 001-1V9a1 1 0 00-1-1H5"/><circle cx="17" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg><span>Dompet</span></a>
<a href="/referral"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M14.5 14c2.5 0 5 1.7 5 4.5"/></svg><span>Referral</span></a>
<a href="/profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Profil</span></a>
</nav>
<div class="spinner-wrap"><svg class="swirl" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#25D366"/><stop offset="100%" stop-color="#128C7E"/></linearGradient></defs><g fill="none" stroke="url(#sg)"><circle class="r1" cx="32" cy="32" r="28" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r2" cx="32" cy="32" r="22" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r3" cx="32" cy="32" r="16" stroke-width="1.6" stroke-dasharray="1.6 4.4"/><circle class="r4" cx="32" cy="32" r="10" stroke-width="1.6" stroke-dasharray="1.6 4"/><circle class="r5" cx="32" cy="32" r="4.5" stroke-width="1.8" stroke-dasharray="1.4 3"/><circle class="core" cx="32" cy="32" r="3.5" fill="#25D366" stroke="none"/></g></svg></div>
<div class="toast"></div>
<script src="/js/app.js"></script>
<script>
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{document.getElementById('amount').value=b.dataset.v;});
document.getElementById('wdBtn').onclick=async()=>{
const amount=Number(document.getElementById('amount').value);
const method=document.getElementById('method').value;
const account=document.getElementById('account').value.trim();
const holder=document.getElementById('holder').value.trim();
if(!amount||amount<10000)return toast('Minimal Rp 10.000');
if(!account||!holder)return toast('Isi rekening dan nama');
const r=await api('/api/wd',{amount,method,account,holder});
if(r.ok){toast('Pengajuan terkirim ke admin');loadWd();}else toast(r.msg);
};
async function loadWd(){const r=await api('/api/wd/mine');const el=document.getElementById('wdList');if(!r.ok||!r.withdrawals.length){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:14px;">Belum ada data</div>';return;}el.innerHTML=r.withdrawals.map(w=>`<div style="padding:12px;background:var(--card2);border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;"><div><b>Rp ${w.amount.toLocaleString('id-ID')}</b><div style="color:var(--muted);font-size:11px;">${w.method} • ${w.account}</div></div><span class="badge ${w.status==='done'?'green':w.status==='rejected'?'red':'yellow'}">${w.status.toUpperCase()}</span></div>`).join('');}
loadWd();
</script>
</body>
</html>
