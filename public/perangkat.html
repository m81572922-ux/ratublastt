<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Perangkat — RatuBlast</title>
<link rel="icon" href="/uploads/logo.png"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body data-auth="1">
<div class="container">
<div class="topbar"><div class="brand"><img src="/uploads/logo.png" onerror="this.style.display='none'"/> Perangkat</div></div>
<div class="card">
<h3>Tambah Perangkat</h3>
<div class="sub">Pilih metode untuk menghubungkan WhatsApp:</div>
<div class="pair-opt" id="optQR">
<div class="ic"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2z"/></svg></div>
<div class="meta"><b>Scan QR Code</b><p>Pindai kode QR via WhatsApp di ponsel</p></div>
<div class="chev">›</div>
</div>
<div class="pair-opt" id="optCode">
<div class="ic"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.7 1.4-3.1 3.1-3.1h4V7H7a5 5 0 100 10h4v-1.9H7A3.1 3.1 0 013.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 010 6.2h-4V17h4a5 5 0 100-10z"/></svg></div>
<div class="meta"><b>Pairing Code (8 Digit)</b><p>Koneksikan pakai 8 digit kode pairing</p></div>
<div class="chev">›</div>
</div>
</div>
<div class="card">
<h3>Data Perangkat</h3>
<div class="sub">Total perangkat aktif</div>
<div class="stat" style="margin-bottom:10px;"><div class="lbl">Perangkat Tersisa</div><div class="val purple"><span id="devCount">0</span> / 4</div></div>
<div id="devList"></div>
</div>
</div>
<nav class="nav-bottom">
<a href="/dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
<a href="/perangkat" class="active"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg><span>Perangkat</span></a>
<a href="/dompet"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v2"/><path d="M3 7v10a2 2 0 002 2h14a1 1 0 001-1V9a1 1 0 00-1-1H5"/><circle cx="17" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg><span>Dompet</span></a>
<a href="/referral"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M14.5 14c2.5 0 5 1.7 5 4.5"/></svg><span>Referral</span></a>
<a href="/profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Profil</span></a>
</nav>
<div class="spinner-wrap"><svg class="swirl" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#25D366"/><stop offset="100%" stop-color="#128C7E"/></linearGradient></defs><g fill="none" stroke="url(#sg)"><circle class="r1" cx="32" cy="32" r="28" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r2" cx="32" cy="32" r="22" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r3" cx="32" cy="32" r="16" stroke-width="1.6" stroke-dasharray="1.6 4.4"/><circle class="r4" cx="32" cy="32" r="10" stroke-width="1.6" stroke-dasharray="1.6 4"/><circle class="r5" cx="32" cy="32" r="4.5" stroke-width="1.8" stroke-dasharray="1.4 3"/><circle class="core" cx="32" cy="32" r="3.5" fill="#25D366" stroke="none"/></g></svg></div>
<div class="toast"></div>
<script src="/js/app.js"></script>
<script>
async function load(){const r=await api('/api/devices');const el=document.getElementById('devList');const cnt=document.getElementById('devCount');if(!r.ok)return;cnt.textContent=r.devices.length;if(!r.devices.length){el.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px;">Belum ada perangkat terdaftar</div>';return;}el.innerHTML=r.devices.map(d=>`<div style="padding:12px;background:var(--card2);border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;"><div><b>${d.phone||d.device_id.slice(0,10)}</b><div style="color:var(--muted);font-size:11px;">${d.device_id.slice(0,16)}…</div></div><span class="badge ${d.live?'green':'red'}">${d.live?'ONLINE':'OFFLINE'}</span></div>`).join('');}
load();
document.getElementById('optQR').onclick=()=>openQRModal();
document.getElementById('optCode').onclick=()=>openCodeModal();
function modalWrap(title,subtitle,innerHTML){const m=document.createElement('div');m.className='modal-back open';m.innerHTML=`<div class="modal"><button class="close" onclick="this.closest('.modal-back').remove()">✕</button><h2>🔗 ${title}</h2><p class="sub">${subtitle}</p><div id="pairArea">${innerHTML}</div></div>`;document.body.appendChild(m);return m;}
async function openQRModal(){const m=modalWrap('Scan QR Code','Buka WhatsApp → Perangkat Tertaut → Tautkan perangkat, lalu scan QR.','<div class="qr-frame"><div style="color:var(--muted);">Memuat QR…</div></div>');const area=m.querySelector('#pairArea');const did='dev_'+Date.now();const r=await api('/api/device/start',{device_id:did});if(r.ok&&r.qr){area.innerHTML=`<div class="qr-frame"><img src="${r.qr}" alt="QR"/><p>Scan dengan WhatsApp untuk menautkan perangkat</p></div>`;}else{area.innerHTML=`<div style="color:var(--danger);padding:12px;">${r.msg||'Gagal generate QR'}</div>`;}}
function openCodeModal(){const m=modalWrap('Pairing Code (8 Digit)','Masukkan nomor WhatsApp Anda untuk mendapatkan 8 digit kode pairing.',`<label>NOMOR WHATSAPP ANDA</label><input class="input" id="phoneNum" placeholder="Contoh: 62812xxxxxxx" inputmode="numeric"/><p style="color:var(--muted);font-size:11px;margin-top:-4px;margin-bottom:14px;">Gunakan kode negara (62…), tanpa spasi atau tanda +</p><button class="btn green" id="reqCode">Mulai Pairing & Dapatkan Kode</button><div id="codeOut" style="margin-top:14px;"></div>`);const area=m.querySelector('#pairArea');area.querySelector('#reqCode').onclick=async()=>{const phone=area.querySelector('#phoneNum').value.trim().replace(/[^0-9]/g,'');if(!phone||phone.length<8)return toast('Nomor tidak valid');const btn=area.querySelector('#reqCode');btn.disabled=true;btn.textContent='Memproses…';const did='dev_'+Date.now();await api('/api/device/start',{device_id:did});await new Promise(r=>setTimeout(r,2500));const r=await api('/api/device/paircode',{device_id:did,phone});if(r.ok){area.querySelector('#codeOut').innerHTML=`<div class="link-box"><code>${r.code}</code><button onclick="navigator.clipboard.writeText('${r.code}');toast('Kode disalin');">Salin</button></div><p style="color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5;">Buka WhatsApp → <b>Perangkat Tertaut</b> → <b>Tautkan dengan nomor telepon</b>, lalu masukkan kode di atas.</p>`;btn.textContent='Kode Terkirim';}else{btn.disabled=false;btn.textContent='Coba Lagi';area.querySelector('#codeOut').innerHTML=`<div style="color:var(--danger);padding:8px 0;">${r.msg}</div>`;}};}
</script>
</body>
</html>
