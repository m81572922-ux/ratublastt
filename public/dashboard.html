<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dashboard — RatuBlast</title>
<link rel="icon" href="/uploads/logo.png"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body data-auth="1">
<div class="container">
<div class="topbar">
<div class="brand"><img src="/uploads/logo.png" onerror="this.style.display='none'"/> RatuBlast</div>
<span class="badge green">AKTIF</span>
</div>
<div class="card">
<h3>Selamat Datang!</h3>
<div class="sub">Halo <b><span data-uname></span></b>, kelola blast WhatsApp dari sini.</div>
</div>
<div class="grid2" style="margin-bottom:14px;">
<div class="stat"><div class="lbl">Saldo Rupiah</div><div class="val green" data-saldo>Rp 0</div></div>
<div class="stat"><div class="lbl">Kuota Hari Ini</div><div class="val purple" data-quota>0</div></div>
</div>
<div class="card">
<h3>Ringkasan Performa Blast</h3>
<div class="sub">Statistik akumulasi semua device</div>
<div class="grid2">
<div class="stat"><div class="lbl">Total Blast</div><div class="val" id="totalBlast">0</div></div>
<div class="stat"><div class="lbl">Sukses</div><div class="val green" id="sukses">0</div></div>
<div class="stat"><div class="lbl">Gagal</div><div class="val red" id="gagal">0</div></div>
<div class="stat"><div class="lbl">Device Online</div><div class="val purple" id="online">0</div></div>
</div>
</div>
<div class="card">
<h3>Aktivitas Terakhir</h3>
<div id="activityList" style="font-size:13px;color:var(--muted);">Memuat…</div>
</div>
</div>
<nav class="nav-bottom">
<a href="/dashboard" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
<a href="/perangkat"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg><span>Perangkat</span></a>
<a href="/dompet"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v2"/><path d="M3 7v10a2 2 0 002 2h14a1 1 0 001-1V9a1 1 0 00-1-1H5"/><circle cx="17" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg><span>Dompet</span></a>
<a href="/referral"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M14.5 14c2.5 0 5 1.7 5 4.5"/></svg><span>Referral</span></a>
<a href="/profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Profil</span></a>
</nav>
<div class="spinner-wrap"><svg class="swirl" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#25D366"/><stop offset="100%" stop-color="#128C7E"/></linearGradient></defs><g fill="none" stroke="url(#sg)"><circle class="r1" cx="32" cy="32" r="28" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r2" cx="32" cy="32" r="22" stroke-width="1.6" stroke-dasharray="1.6 4.6"/><circle class="r3" cx="32" cy="32" r="16" stroke-width="1.6" stroke-dasharray="1.6 4.4"/><circle class="r4" cx="32" cy="32" r="10" stroke-width="1.6" stroke-dasharray="1.6 4"/><circle class="r5" cx="32" cy="32" r="4.5" stroke-width="1.8" stroke-dasharray="1.4 3"/><circle class="core" cx="32" cy="32" r="3.5" fill="#25D366" stroke="none"/></g></svg></div>
<div class="toast"></div>
<script src="/js/app.js"></script>
<script>
(async()=>{
const b=await api('/api/blasts');
if(b.ok){let t=0,s=0,g=0;b.blasts.forEach(x=>{t++;s+=x.sukses;g+=x.gagal;});document.getElementById('totalBlast').textContent=t;document.getElementById('sukses').textContent=s;document.getElementById('gagal').textContent=g;document.getElementById('activityList').innerHTML=b.blasts.length?b.blasts.slice(0,5).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border);">#${x.id} • ${x.sukses} sukses / ${x.gagal} gagal</div>`).join(''):'Belum ada aktivitas';}
const d=await api('/api/devices');
if(d.ok)document.getElementById('online').textContent=d.devices.filter(x=>x.live).length;
})();
</script>
</body>
</html>
